name: CI

on:
  push:
  pull_request:

jobs:
  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run logic tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\run-tests.ps1
      - name: Run logic tests (PowerShell 7)
        shell: pwsh
        run: .\tests\run-tests.ps1

  tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run logic tests (bash 3.2, the macOS system shell)
        run: /bin/bash tests/run-tests.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck macos script
        run: shellcheck macos/lockdown.sh tests/run-tests.sh

  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks-action reads the PR's commit list; without these the pull_request
    # event 403s ("Resource not accessible by integration") while push passes.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
