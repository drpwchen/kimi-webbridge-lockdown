name: CI

on:
  push:
  pull_request:

jobs:
  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run logic tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\run-tests.ps1
      - name: Run logic tests (PowerShell 7)
        shell: pwsh
        run: .\tests\run-tests.ps1

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck macos script
        run: shellcheck macos/lockdown.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
